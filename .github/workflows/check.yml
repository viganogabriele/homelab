name: check

# Fails the build if the public site contains private data (IPs, ports, internal
# hostnames, e-mail addresses, keys...). See check.mjs and the README.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
