    <radialGradient id="b" cx="1" cy="0.15" r="0.75"><stop offset="0" stop-color="#ff5fc8" stop-opacity="0.26"/><stop offset="1" stop-color="#ff5fc8" stop-opacity="0"/></radialGradient>
    <radialGradient id="c" cx="0.6" cy="1.1" r="0.8"><stop offset="0" stop-color="#2ed3f0" stop-opacity="0.18"/><stop offset="1" stop-color="#2ed3f0" stop-opacity="0"/></radialGradient>
